name: 90 Meclis · Yayın (bülten, analiz, seçim, kilit)

on:
  schedule:
    - cron: "20 * * * *"   # her saat :20 UTC = her saat :20 TSİ (seçim en geç başlamadan 3 saat önce kilitlenir)
  workflow_dispatch:

concurrency:
  group: meclis-yayin
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  is:
    uses: ./.github/workflows/_meclis-is.yml
    secrets: inherit
    with:
      komut: yayin
      sure: 55

