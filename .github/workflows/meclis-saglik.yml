name: 90 Meclis · Sağlık denetimi + canlı tutma

on:
  schedule:
    - cron: "10 6,18 * * *"   # TSİ 09:10 ve 21:10
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  denetim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Zamanlanmış işleri etkin tut (GitHub'ın 60 gün hareketsizlik kapatmasına karşı)
        run: |
          for w in meclis-yayin.yml meclis-canli.yml meclis-sonuc.yml meclis-gundem.yml meclis-gece.yml meclis-saglik.yml pages.yml; do
            gh api -X PUT "repos/$REPO/actions/workflows/$w/enable" >/dev/null 2>&1 || true
          done
      - name: Son başarılı çalışmalar (v_sistem_durumu) — gecikme varsa issue
        run: |
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' --max-time 20 "$SUPABASE_URL/rest/v1/v_sistem_durumu?select=is_adi,gecikti,son_basari,son_mesaj" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" || true)
          if [ "$code" != "200" ]; then
            # 402 = kota kısıtı: tek issue'yu ortak iş akışı (_meclis-is) yönetir; burada yalnızca uyarı
            echo "::warning::Supabase HTTP $code — sağlık denetimi atlandı."; exit 0
          fi
          R=$(cat /tmp/r.json)
          echo "$R"
          GEC=$(echo "$R" | jq -r '[.[] | select(.gecikti) | .is_adi] | join(", ")')
          if [ -z "$GEC" ]; then echo "Tüm işler zamanında."; exit 0; fi
          gh label create otomatik-izleme --color B60205 -d "Zamanlanmış iş hataları" -R "$REPO" 2>/dev/null || true
          T="Sağlık denetimi: geciken işler"
          N=$(gh issue list -R "$REPO" -l otomatik-izleme -s open --search "in:title \"$T\"" --json number -q '.[0].number')
          B="$(date -u '+%F %H:%M') UTC — son başarılı çalışması geciken işler: $GEC"
          if [ -n "$N" ]; then
            L=$(gh issue view "$N" -R "$REPO" --json comments,createdAt -q '(.comments[-1].createdAt // .createdAt)')
            [ $(( $(date -u +%s) - $(date -u -d "$L" +%s) )) -gt 86400 ] && gh issue comment "$N" -R "$REPO" -b "$B" || true
          else gh issue create -R "$REPO" -t "$T" -l otomatik-izleme -b "$B"; fi
