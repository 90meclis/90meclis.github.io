# Ortak çalıştırıcı (yeniden kullanılabilir iş akışı). Zamanlamalar meclis-*.yml dosyalarındadır.
# Mimari (28.10.2026'dan beri): barındırılan veritabanı YOK. Veri, GitHub Release "veritabani" varlığındaki SQLite
# dosyasıdır; iş onu indirir, çalışır, geri yükler (günlük anlık görüntü dahil). Aynı anda tek iş yazar
# (concurrency: meclis-veritabani). Site yalnızca `veri` dalındaki statik JSON'u okur. Kilitli tahmin/kupon ve
# Kanıt Mührü main dalında yalnızca-ekleme JSONL olarak tutulur (defter/, muhur/).
name: _meclis-is

on:
  workflow_call:
    inputs:
      komut: {type: string, required: true}
      sure: {type: number, default: 55}
      muhur_commit: {type: boolean, default: false}
      yedek: {type: boolean, default: false}

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.sure }}
    concurrency:
      group: meclis-veritabani
      cancel-in-progress: false
    env:
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ github.token }}
      LOCAL_DB_PATH: ${{ github.workspace }}/vt/meclis.db
      MECLIS_STATIK_DIR: statik
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      SPORTMONKS_KEY: ${{ secrets.SPORTMONKS_KEY }}
      FOOTYSTATS_KEY: ${{ secrets.FOOTYSTATS_KEY }}
      SPORTDEVS_KEY: ${{ secrets.SPORTDEVS_KEY }}
      THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
      BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
      HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
      BIGBALLS_KEY: ${{ secrets.BIGBALLS_KEY }}
      NOSYAPI_KEY: ${{ secrets.NOSYAPI_KEY }}
      PLAYERELO_KEY: ${{ secrets.PLAYERELO_KEY }}
      LEAGUES: ${{ vars.LEAGUES }}
      BOT_HORIZON_HOURS: "72"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Veritabanını indir (Release → vt/meclis.db)
        id: vt
        run: bash scripts/vt.sh indir "$LOCAL_DB_PATH" && echo "ok=1" >> "$GITHUB_OUTPUT"
      - name: Statik site verisi (veri dalı) → statik/
        run: bash scripts/veri.sh al statik
      - name: python -m meclis ${{ inputs.komut }}
        id: calis
        # İşin süresinden 10 dk önce durdurulur: yarım kalsa bile veritabanı ve defter sonraki adımlarda kaydedilir.
        run: timeout -s INT -k 60 $(( (${{ inputs.sure }} - 10) * 60 )) python -m meclis "${{ inputs.komut }}"
      - name: Defter + Kanıt Mührü (yalnızca ekleme)
        if: ${{ !cancelled() && steps.vt.outputs.ok == '1' }}
        run: python -m meclis.defter_git .
      - name: Veritabanını yükle (Release; günlük anlık görüntü)
        if: ${{ !cancelled() && steps.vt.outputs.ok == '1' }}
        run: bash scripts/vt.sh yukle "$LOCAL_DB_PATH"
      - name: Statik site verisi → veri dalı
        if: ${{ !cancelled() && steps.vt.outputs.ok == '1' }}
        run: bash scripts/veri.sh gonder statik "${{ inputs.komut }}"
      - name: Defter / mühür → main
        if: ${{ !cancelled() && steps.vt.outputs.ok == '1' }}
        run: |
          git config user.name "90-meclis-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add defter muhur
          if git diff --cached --quiet; then echo "Defter değişmedi."; exit 0; fi
          git commit -qm "Defter ${{ inputs.komut }} $(date -u '+%F %H:%M')"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((RANDOM % 7 + 3)); done
      - name: Hata → GitHub issue (otomatik-izleme)
        if: ${{ failure() }}
        env:
          KOMUT: ${{ inputs.komut }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create otomatik-izleme --color B60205 -d "Zamanlanmış iş hataları" 2>/dev/null || true
          T="Otomatik iş hatası: $KOMUT"
          N=$(gh issue list -l otomatik-izleme -s open --search "in:title \"$T\"" --json number -q '.[0].number')
          B="$(date -u '+%F %H:%M') UTC — $KOMUT başarısız: $URL"
          # yorum yağmuru yok: açık issue varsa son 24 saatte en fazla bir yorum
          if [ -n "$N" ]; then
            L=$(gh issue view "$N" --json comments,createdAt -q '(.comments[-1].createdAt // .createdAt)')
            if [ $(( $(date -u +%s) - $(date -u -d "$L" +%s) )) -gt 86400 ]; then gh issue comment "$N" -b "$B"; else echo "Issue #$N açık (son 24 saatte bildirildi)."; fi
          else gh issue create -t "$T" -l otomatik-izleme -b "$B"; fi
