name: 90 Meclis web sitesi (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "45 5 * * *"   # 08:45 TSİ: sabah bültenden sonra maç SEO sayfaları yeniden üretilir

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VITE_SUPABASE_URL: https://fwispwtdqapmnkcjisek.supabase.co
      # Yalnızca publishable (anon) anahtar. service_role / secret anahtar derlemeyi durdurur (scripts/check-key.mjs).
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Anon okuma denetimi (RLS)
        if: env.VITE_SUPABASE_PUBLISHABLE_KEY != ''
        continue-on-error: true
        run: |
          for t in matches teams match_stats injuries trends lineups weather agenda analyses coupons predictions; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$VITE_SUPABASE_URL/rest/v1/$t?select=*&limit=1" -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY")
            echo "$t: $code"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
