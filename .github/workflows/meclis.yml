name: 90 Meclis zamanlanmış işler

on:
  schedule:
    - cron: "0 5 * * *"        # 08:00 TSİ — sabah: havuz + gündem + bot + sonuçlandırma
    - cron: "15 9-21/2 * * *"  # gün içi: her 2 saatte bot (Karar Bekliyor maçları yeniden dener) + sonuçlandırma
    - cron: "30 23 * * *"      # gece: sonuçlandırma
    - cron: "40 0 * * *"       # 03:40 TSİ — API-Football günlük kotası sıfırlandıktan sonra geçmiş veri doldurma
  workflow_dispatch:
    inputs:
      komut:
        description: "Komut (sabah / bot / sonuclandir / gundem / yenile / kadro / gecmis)"
        required: true
        default: "sabah"

concurrency:
  group: meclis
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      SPORTMONKS_KEY: ${{ secrets.SPORTMONKS_KEY }}
      FOOTYSTATS_KEY: ${{ secrets.FOOTYSTATS_KEY }}
      SPORTDEVS_KEY: ${{ secrets.SPORTDEVS_KEY }}
      CLUBELO_KEY: ${{ secrets.CLUBELO_KEY }}
      THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
      BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
      LEAGUES: ${{ vars.LEAGUES }}  # boşsa meclis/config.py DEFAULT_LEAGUES (21 lig)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Supabase kontrolü
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY secret'ları tanımlı değil; kalıcı kayıt olmadan çalışmak anlamsız."
            exit 1
          fi
      - name: Komutu belirle
        id: k
        env:
          OLAY: ${{ github.event_name }}
          ZAMAN: ${{ github.event.schedule }}
          GIRDI: ${{ github.event.inputs.komut }}
        run: |
          if [ "$OLAY" = "workflow_dispatch" ]; then
            case "$GIRDI" in
              sabah|bot|sonuclandir|gundem|yenile|durum|kadro|gecmis) komut="$GIRDI" ;;
              *) echo "::error::Geçersiz komut: $GIRDI"; exit 1 ;;
            esac
          elif [ "$ZAMAN" = "0 5 * * *" ]; then
            komut=sabah
          elif [ "$ZAMAN" = "30 23 * * *" ]; then
            komut=sonuclandir
          elif [ "$ZAMAN" = "40 0 * * *" ]; then
            komut=gecmis
          else
            komut=gunici
          fi
          echo "komut=$komut" >> "$GITHUB_OUTPUT"
      - name: Çalıştır
        env:
          KOMUT: ${{ steps.k.outputs.komut }}
        run: |
          if [ "$KOMUT" = "gunici" ]; then
            python -m meclis yenile
            python -m meclis kadro
            python -m meclis bot
            python -m meclis sonuclandir
          else
            python -m meclis "$KOMUT"
          fi
