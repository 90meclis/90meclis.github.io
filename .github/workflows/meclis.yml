name: 90 Meclis zamanlanmış işler

on:
  schedule:
    - cron: "0 5 * * *"        # 08:00 TSİ — sabah: havuz + gündem + bot + sonuçlandırma
    - cron: "15 1-21/2 * * *"  # gece + gün içi her 2 saatte: havuz (7 gün) + kadro/eksik/ilk 11 + bot (yayımlanmamış adayları yeniden hesaplar) + sonuçlandırma
    - cron: "30 23 * * *"      # gece: sonuçlandırma
    - cron: "40 0 * * *"       # 03:40 TSİ — geçmiş veri + bu sezonun oyuncu dakikaları/istatistikleri (sezon) + gece yedeği (backups dalı)
  workflow_dispatch:
    inputs:
      komut:
        description: "Komut (sabah / gunici / bot / analiz / sonuclandir / gundem / yenile / kadro / gecmis / sezon / yedek)"
        required: true
        default: "sabah"

concurrency:
  group: meclis
  cancel-in-progress: false

permissions:
  contents: write  # yalnızca gece yedeğini 'backups' dalına yazmak için

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
      SPORTMONKS_KEY: ${{ secrets.SPORTMONKS_KEY }}
      FOOTYSTATS_KEY: ${{ secrets.FOOTYSTATS_KEY }}
      SPORTDEVS_KEY: ${{ secrets.SPORTDEVS_KEY }}
      THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
      BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
      LEAGUES: ${{ vars.LEAGUES }}  # boşsa 23 çekirdek lig + AUTO (BSD'deki diğer kulüp ligleri/kupaları)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Supabase kontrolü
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY secret'ları tanımlı değil; kalıcı kayıt olmadan çalışmak anlamsız."
            exit 1
          fi
      - name: Komutu belirle
        id: k
        env:
          OLAY: ${{ github.event_name }}
          ZAMAN: ${{ github.event.schedule }}
          GIRDI: ${{ github.event.inputs.komut }}
        run: |
          if [ "$OLAY" = "workflow_dispatch" ]; then
            case "$GIRDI" in
              sabah|gunici|bot|analiz|sonuclandir|gundem|yenile|durum|kadro|gecmis|sezon|yedek) komut="$GIRDI" ;;
              *) echo "::error::Geçersiz komut: $GIRDI"; exit 1 ;;
            esac
          elif [ "$ZAMAN" = "0 5 * * *" ]; then
            komut=sabah
          elif [ "$ZAMAN" = "30 23 * * *" ]; then
            komut=sonuclandir
          elif [ "$ZAMAN" = "40 0 * * *" ]; then
            komut=gecmis
          else
            komut=gunici
          fi
          echo "komut=$komut" >> "$GITHUB_OUTPUT"
      - name: Çalıştır
        env:
          KOMUT: ${{ steps.k.outputs.komut }}
        run: |
          # gunici: yenile + kadro + bot + sonuclandir; kaçırılan sabah/gece adımlarını (gündem, sezon, gece doldurma,
          # yedek) son başarılı çalışma zamanına bakarak kendisi telafi eder (meclis/__main__.py _overdue)
          python -m meclis "$KOMUT"
      - name: Gece yedeği → backups dalı (defterin ikinci kopyası + 60 gün hareketsizlik koruması)
        if: ${{ !cancelled() }}
        env:
          KOMUT: ${{ steps.k.outputs.komut }}
        run: |
          if [ "$KOMUT" != "gecmis" ] && [ "$KOMUT" != "yedek" ] && [ ! -f /tmp/meclis_yedek_gerekli ]; then
            echo "Yedek bu çalışmada gerekmiyor."; exit 0
          fi
          python -m meclis yedek --cikti /tmp/yedek
          git config user.name "90-meclis-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin backups; then
            git worktree add -q -B backups /tmp/bk origin/backups
          else
            git worktree add -q --detach /tmp/bk
            cd /tmp/bk && git checkout -q --orphan backups && git rm -rfq . && cd -
          fi
          rsync -a --delete --exclude .git /tmp/yedek/ /tmp/bk/
          cd /tmp/bk
          git add -A
          git diff --cached --quiet || git commit -qm "Yedek $(date -u +%F)"
          git push -q origin backups
