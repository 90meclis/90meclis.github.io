name: 90 Meclis · Canlı skor

# Başlamış maçların skoru/dakikası (ESPN, anahtarsız/kotasız). Supabase'e HİÇ dokunmaz (egress 0): maç listesi
# statik gün dosyalarından (veri dalı) okunur, sonuç veri dalındaki canli.json'a yazılır; site oradan bindirir.
# Resmî sonuç bu işte YAZILMAZ (sonuç işi kesinleştirir).
on:
  schedule:
    - cron: "*/10 10-23 * * *"  # TSİ 13:00–02:59 arası 10 dakikada bir
    - cron: "*/10 0-1 * * *"
  workflow_dispatch:

concurrency:
  group: meclis-canli
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  canli:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash scripts/veri.sh al statik
      - name: Canlı skor → statik/canli.json
        run: python -m meclis.canli statik
      - run: bash scripts/veri.sh gonder statik canli
